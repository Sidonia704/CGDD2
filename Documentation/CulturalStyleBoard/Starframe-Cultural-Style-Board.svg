<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2760" viewBox="0 0 1800 2760">
<rect x="0" y="0" width="1800" height="2760" rx="0" fill="#F2F0E8" stroke="none"/>
<rect x="0" y="0" width="1800" height="14" rx="0" fill="#177D87" stroke="none"/>
<text x="70" y="65" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#177D87">STARFRAME  /  CULTURAL STYLE BOARD</text>
<text x="1730" y="65" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#50656B">01</text>
<text x="70" y="131" font-family="Arial, sans-serif" font-size="57" font-weight="700" fill="#172D36">Starframe — Cultural Style: DIY Maker Culture</text>
<text x="70" y="176" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#50656B">A personal workshop in space. Build something you understand.</text>
<rect x="70" y="213" width="1660" height="299" rx="8" fill="#172D36" stroke="none"/>
<text x="98" y="252" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#72CED0">01  REAL-LIFE OBSERVATION</text>
<text x="98" y="287" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#FFFFFF">I miss the freedom to build that I experienced in Robocraft and Minecraft, and I want to bring that creative excitement</text>
<text x="98" y="321" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#FFFFFF">into my own game.</text>
<text x="98" y="366" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#72CED0">02  CLAIM</text>
<text x="98" y="401" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#FFFFFF">DIY culture gives players ownership and understanding through making, testing and improving their own spacecraft.</text>
<text x="98" y="450" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#72CED0">03  PLAYER ACTIONS</text>
<text x="98" y="486" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#FFFFFF">Assemble a ship • Configure thrust • Compare performance • Diagnose failures • Revise blueprints</text>
<rect x="70" y="546" width="46" height="37" rx="0" fill="#177D87" stroke="none"/>
<text x="80" y="573" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#FCFBF6">1</text>
<text x="135" y="575" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172D36">MEANING</text>
<text x="92" y="625" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#177D87">OWNERSHIP</text>
<text x="92" y="653" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172D36">Create a ship with a personal identity through its parts and layout.</text>
<text x="92" y="689" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#177D87">LEARNING BY DOING</text>
<text x="92" y="717" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172D36">Test an idea, observe what fails, then change the design.</text>
<text x="92" y="753" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#177D87">RESOURCEFULNESS</text>
<text x="92" y="781" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172D36">Balance protection, firepower, mass and energy within a budget.</text>
<text x="92" y="817" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#177D87">PERSISTENCE</text>
<text x="92" y="845" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172D36">Keep the blueprint and improve it after a failed attempt.</text>
<rect x="70" y="878" width="1110" height="1122" rx="8" fill="#FCFBF6" stroke="#CDD5D0"/>
<rect x="70" y="900" width="46" height="37" rx="0" fill="#177D87" stroke="none"/>
<text x="80" y="927" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#FCFBF6">2</text>
<text x="135" y="929" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172D36">PLAY &amp; INTERACTION</text>
<text x="92" y="968" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#50656B">THE WORKSHOP LOOP</text>
<rect x="92" y="990" width="184" height="54" rx="4" fill="#172D36" stroke="none"/>
<text x="110" y="1025" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#FCFBF6">BUILD</text>
<text x="282" y="1024" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#177D87">›</text>
<rect x="305" y="990" width="184" height="54" rx="4" fill="#172D36" stroke="none"/>
<text x="323" y="1025" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#FCFBF6">TEST</text>
<text x="495" y="1024" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#177D87">›</text>
<rect x="518" y="990" width="184" height="54" rx="4" fill="#172D36" stroke="none"/>
<text x="536" y="1025" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#FCFBF6">DIAGNOSE</text>
<text x="708" y="1024" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#177D87">›</text>
<rect x="731" y="990" width="184" height="54" rx="4" fill="#172D36" stroke="none"/>
<text x="749" y="1025" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#FCFBF6">REVISE</text>
<text x="921" y="1024" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#177D87">›</text>
<rect x="944" y="990" width="184" height="54" rx="4" fill="#B7502C" stroke="none"/>
<text x="962" y="1025" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#FCFBF6">FIGHT</text>
<text x="92" y="1088" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#172D36">Assemble a modular ship on a 3D grid. Arrange directional propulsion, protection</text>
<text x="92" y="1123" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#172D36">and weapons. Test it in the range, inspect its behavior, then revise the</text>
<text x="92" y="1158" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#172D36">blueprint. Arcade combat puts the design under pressure.</text>
<text x="92" y="1248" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#177D87">FREEDOM + CONSEQUENCES</text>
<text x="92" y="1283" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#172D36">All parts are available from the start. Save unfinished experiments freely;</text>
<text x="92" y="1318" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#172D36">deployment requires a connected ship within budget. Blocked exhaust reduces</text>
<text x="92" y="1353" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#172D36">thrust, armor adds mass, and low power reduces output.</text>
<rect x="90" y="1432" width="1070" height="181" rx="5" fill="#F2E8DC" stroke="none"/>
<text x="112" y="1470" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#B7502C">WORKSHOP TABOO → GAME RULE</text>
<text x="112" y="1508" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172D36">Never adjust a machine while it is running. In Starframe, manual structural</text>
<text x="112" y="1540" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172D36">editing is unavailable during combat. Finish or exit the run and return to the</text>
<text x="112" y="1572" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172D36">build area; the design must face the consequences until then.</text>
<text x="92" y="1661" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#177D87">UI AS A WORKBENCH</text>
<text x="92" y="1696" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#172D36">A parts catalogue, blueprint name and component data frame the ship. The flight</text>
<text x="92" y="1731" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#172D36">HUD acts as onboard diagnostics: speed, energy and component condition help</text>
<text x="92" y="1766" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#172D36">players explain a failure and decide what to change.</text>
<text x="92" y="1851" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#177D87">REFERENCES / WHAT TO BORROW</text>
<text x="92" y="1888" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172D36">Robocraft: modular construction shapes combat performance. Minecraft: simple blocks</text>
<text x="92" y="1921" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172D36">support personal invention. Borrow these relationships between creation and play.</text>
<rect x="70" y="2044" width="46" height="37" rx="0" fill="#177D87" stroke="none"/>
<text x="80" y="2071" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#FCFBF6">3</text>
<text x="135" y="2073" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172D36">SPACES</text>
<text x="92" y="2117" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172D36">A proposed assembly bay uses modular frames and component racks. The test range becomes</text>
<text x="92" y="2150" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172D36">a ritual space for first launch, measurement and return. Cold planetary light and worn</text>
<text x="92" y="2183" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172D36">orbital panels suggest repeated use, repair and experimentation.</text>
<rect x="70" y="2271" width="46" height="37" rx="0" fill="#177D87" stroke="none"/>
<text x="80" y="2298" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#FCFBF6">4</text>
<text x="135" y="2300" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172D36">SOUND</text>
<text x="92" y="2344" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172D36">Equipment hum and restrained electronics support concentration. Placement clicks mark</text>
<text x="92" y="2377" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172D36">decisions; engine response makes tests readable. A power warning prompts diagnosis,</text>
<text x="92" y="2410" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172D36">while a clean launch after revision marks progress.</text>
<rect x="70" y="2491" width="46" height="37" rx="0" fill="#177D87" stroke="none"/>
<text x="80" y="2518" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#FCFBF6">5</text>
<text x="135" y="2520" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172D36">LOOK</text>
<text x="92" y="2564" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172D36">Modular blocks, exposed joints and clear silhouettes reveal how things fit. Graphite,</text>
<text x="92" y="2597" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172D36">off-white and cyan keep tools readable; amber and red mark warnings. Work lights and</text>
<text x="92" y="2630" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172D36">scuffed metal suggest a machine made to be used.</text>
<text x="1230" y="575" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#177D87">THE PLAYER AS MAKER</text>
<text x="1230" y="618" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#50656B">Design intention: a practical workshop</text>
<text x="1230" y="651" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#50656B">culture expressed through play, space and</text>
<text x="1230" y="684" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#50656B">feedback.</text>
<rect x="1230" y="760" width="500" height="310" rx="5" fill="#E6EAE4" stroke="#CDD5D0"/>
<path d="M1260 795h35m-35 0v35M1700 795h-35m35 0v35M1260 1035h35m-35 0v-35M1700 1035h-35m35 0v-35" stroke="#177D87" fill="none" stroke-width="2"/>
<text x="1270" y="885" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#50656B">01 / GAME SCREENSHOT</text>
<text x="1270" y="928" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#50656B">PLACE IMAGE HERE</text>
<text x="1230" y="1109" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172D36">THE PERSONAL WORKBENCH</text>
<text x="1230" y="1142" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#50656B">Assembly view: show the player’s ship, parts</text>
<text x="1230" y="1171" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#50656B">catalogue and component choices.</text>
<rect x="1230" y="1280" width="500" height="310" rx="5" fill="#E6EAE4" stroke="#CDD5D0"/>
<path d="M1260 1315h35m-35 0v35M1700 1315h-35m35 0v35M1260 1555h35m-35 0v-35M1700 1555h-35m35 0v-35" stroke="#177D87" fill="none" stroke-width="2"/>
<text x="1270" y="1405" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#50656B">02 / GAME SCREENSHOT</text>
<text x="1270" y="1448" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#50656B">PLACE IMAGE HERE</text>
<text x="1230" y="1629" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172D36">UNDERSTANDING THE MACHINE</text>
<text x="1230" y="1662" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#50656B">Test flight or diagnostics: show how</text>
<text x="1230" y="1691" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#50656B">performance reveals design decisions.</text>
<rect x="1230" y="1800" width="500" height="310" rx="5" fill="#E6EAE4" stroke="#CDD5D0"/>
<path d="M1260 1835h35m-35 0v35M1700 1835h-35m35 0v35M1260 2075h35m-35 0v-35M1700 2075h-35m35 0v-35" stroke="#177D87" fill="none" stroke-width="2"/>
<text x="1270" y="1925" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#50656B">03 / GAME SCREENSHOT</text>
<text x="1270" y="1968" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#50656B">PLACE IMAGE HERE</text>
<text x="1230" y="2149" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172D36">IDEAS UNDER PRESSURE</text>
<text x="1230" y="2182" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#50656B">Combat or revised ship: show the consequences</text>
<text x="1230" y="2211" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#50656B">of a player-built design.</text>
<rect x="1230" y="2310" width="500" height="374" rx="6" fill="#172D36" stroke="none"/>
<text x="1256" y="2354" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#FCFBF6">6  SOURCES</text>
<text x="1256" y="2396" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#FCFBF6">DIY Maker Culture comes from hands-on</text>
<text x="1256" y="2426" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#FCFBF6">workshop and makerspace practice,</text>
<text x="1256" y="2456" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#FCFBF6">represented by Maker Faire and student</text>
<text x="1256" y="2486" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#FCFBF6">machine shops, with Robocraft and</text>
<text x="1256" y="2516" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#FCFBF6">Minecraft as game references.</text>
<text x="1256" y="2614" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#72CED0">Maker Faire / Mission</text>
<text x="1256" y="2641" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#72CED0">CMU / Makerspace Safety Program</text>
</svg>